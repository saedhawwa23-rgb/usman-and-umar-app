name: Build hybrid task orchestrator APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build, verify, and upload signed hybrid APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure permanent debug signing
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_B64" || { echo 'ANDROID_DEBUG_KEYSTORE_BASE64 is not configured'; exit 1; }
          set +e
          printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > debug.keystore
          decode_status=$?
          set -e
          test "$(sha256sum debug.keystore | cut -d' ' -f1)" = "70ea63b1134cc4e8cf409050fff93d68d709442c7ed919551f283f07db081c6e" || {
            echo "Decoded keystore checksum mismatch (base64 status: $decode_status)" >&2
            exit 1
          }
          chmod 600 debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Install ARM32 cross-compilation toolchain
        run: |
          sudo dpkg --add-architecture armhf
          sudo tee /etc/apt/sources.list.d/armhf-ports.list >/dev/null <<'EOF'
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-security main universe
          EOF
          sudo apt-get update || true
          sudo apt-get install -y gcc-arm-linux-gnueabihf libseccomp-dev:armhf libtalloc-dev:armhf pkg-config

      - name: Build pinned ARM32 PRoot asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/proot
          git clone https://github.com/termux/proot.git /tmp/proot
          git -C /tmp/proot checkout --quiet b8c1f5c5c6730dc9d521d5bd5ce1cfeedecde087
          grep -R --line-number -- '--link2symlink' /tmp/proot/src/cli/proot.c /tmp/proot/src/cli/proot.h
          make -C /tmp/proot/src -j"$(nproc)" \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            CC=arm-linux-gnueabihf-gcc \
            STRIP=arm-linux-gnueabihf-strip \
            CFLAGS='-marm -DARM_cpsr=uregs[16] -DPSR_T_BIT=0x00000020' \
            LDFLAGS="-static -ltalloc -Wl,-z,noexecstack"
          file /tmp/proot/src/proot | tee /tmp/proot-file.txt
          grep -E 'ELF 32-bit.*ARM.*EABI5.*statically linked' /tmp/proot-file.txt
          mkdir -p app/src/main/assets/proot
          cp /tmp/proot/src/proot app/src/main/assets/proot/proot
          chmod 755 app/src/main/assets/proot/proot

      - name: Assemble debug APK with permanent signing
        env:
          ORG_GRADLE_PROJECT_DEBUG_STORE_PASSWORD: android
          ORG_GRADLE_PROJECT_DEBUG_KEY_ALIAS: androiddebugkey
          ORG_GRADLE_PROJECT_DEBUG_KEY_PASSWORD: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests (time-bounded)
        id: tests
        timeout-minutes: 15
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify package, signature, and bundled PRoot asset
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          out=dist
          mkdir -p "$out"
          test "$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump packagename "$apk")" = "com.usmanandumar.app"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -F "versionName='3.8.0'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -F "versionCode='27'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk" | tee "$out/SIGNING_STATUS.txt"
          certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" 2>&1 | tee "$out/SIGNING_CERTS.txt")
          expected_sha1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA1:/{print toupper($2); exit}')
          actual_sha1=$(printf '%s\n' "$certs" | awk -F': ' '/certificate SHA-1 digest:/{print toupper($2); exit}')
          test -n "$actual_sha1" && test "${actual_sha1//:/}" = "${expected_sha1//:/}"
          unzip -l "$apk" | grep -F 'assets/proot/proot'
          unzip -p "$apk" assets/proot/proot > /tmp/proot-from-apk
          file /tmp/proot-from-apk | tee "$out/PROOT_ELF.txt"
          grep -E 'ELF 32-bit.*ARM.*EABI5.*statically linked' "$out/PROOT_ELF.txt"
          sha256sum /tmp/proot-from-apk | tee "$out/PROOT_SHA256SUM.txt"
          cp "$apk" "$out/USMAN-AND-UMAR-v3.8.0.apk"
          cp cloud-backend/redis_task_storage.py "$out/redis_task_storage.py"
          sha256sum "$out/USMAN-AND-UMAR-v3.7.0.apk" | tee "$out/SHA256SUMS.txt"
          printf 'commit=%s\nref=%s\n' "$(git rev-parse HEAD)" "${GITHUB_REF_NAME}" > "$out/BUILD_METADATA.txt"

      - name: Upload APK and verification files (no GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: openswarm-apk-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
