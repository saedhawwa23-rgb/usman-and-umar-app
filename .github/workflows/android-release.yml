name: Publish verified Android artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to build
        required: true
        default: feature/source-migration
      tag:
        description: GitHub Release tag to create
        required: true
        default: v3.4.0-taskuary-ai
      publish_release:
        description: Publish the verified artifact as a GitHub prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-verify-publish:
    name: Build, verify, and package APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned ARM32 and x86_64 PRoot assets
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' | sha256sum --check --status
          4b3ed9fc191431f193570f2a10f2a944db2fed4400d0195e114476979bd914b7  app/src/main/assets/proot/arm32-runtime.bundle
          8b424b4723124fae45bdd3120d55e5b4fb7a2450a52623cdf9371eacc42cd205  app/src/main/assets/proot/x86_64-runtime.bundle
          EOF
          mkdir -p /tmp/proot-runtime-check
          for arch in arm32 x86_64; do
            archive="app/src/main/assets/proot/${arch}-runtime.bundle"
            tar -tzf "$archive" | sort > "/tmp/proot-runtime-check/${arch}-members.txt"
            printf 'loader\nproot\n' > "/tmp/proot-runtime-check/${arch}-expected.txt"
            diff -u "/tmp/proot-runtime-check/${arch}-expected.txt" "/tmp/proot-runtime-check/${arch}-members.txt"
            tar -xOzf "$archive" proot > "/tmp/proot-runtime-check/${arch}-proot"
            tar -xOzf "$archive" loader > "/tmp/proot-runtime-check/${arch}-loader"
            file "/tmp/proot-runtime-check/${arch}-proot" "/tmp/proot-runtime-check/${arch}-loader"
          done
          file /tmp/proot-runtime-check/arm32-proot | grep -E 'ELF 32-bit.*ARM.*EABI5.*statically linked'
          file /tmp/proot-runtime-check/arm32-loader | grep -E 'ELF 32-bit.*ARM.*EABI5.*statically linked'
          file /tmp/proot-runtime-check/x86_64-proot | grep -E 'ELF 64-bit.*x86-64.*statically linked'
          file /tmp/proot-runtime-check/x86_64-loader | grep -E 'ELF 64-bit.*x86-64.*statically linked'
          sha256sum /tmp/proot-runtime-check/*-proot /tmp/proot-runtime-check/*-loader | tee /tmp/proot-runtime-check/member-sha256.txt

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Verify package, version, signature, and runtime assets
        id: build-meta
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          apk=app/build/outputs/apk/debug/app-debug.apk
          out=dist
          mkdir -p "$out"
          test "$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump packagename "$apk")" = "com.usmanandumar.app"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -F "versionName='3.4.0-taskuary-ai'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$out/SIGNING_STATUS.txt"
          printf '\nSigning type: CI-generated Android debug key; not a production release signature.\n' >> "$out/SIGNING_STATUS.txt"
          for runtime in arm32-runtime.bundle x86_64-runtime.bundle; do
            unzip -p "$apk" "assets/proot/$runtime" > "/tmp/$runtime"
            cmp "app/src/main/assets/proot/$runtime" "/tmp/$runtime"
          done
          printf 'Bundled PRoot targets: ARM32/armeabi-v7a and x86_64; see Gradle ABI filters and pinned runtime assets.\n' > "$out/PROOT_RUNTIME_STATUS.txt"
          apk_name="usman-and-umar-${GITHUB_SHA:0:12}.apk"
          cp "$apk" "$out/$apk_name"
          stat -c '%n %s bytes' "$out/$apk_name" | tee "$out/APK_SIZE.txt"
          sha256sum "$out/$apk_name" | tee "$out/SHA256SUMS.txt"
          printf 'commit=%s\nref=%s\ntag=%s\npackage=com.usmanandumar.app\nversion=3.4.0-taskuary-ai\n' \
            "$(git rev-parse HEAD)" "${{ inputs.ref }}" "${{ inputs.tag }}" > "$out/BUILD_METADATA.txt"

      - name: Upload verified APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: usman-and-umar-apk-${{ steps.build-meta.outputs.commit }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          tag_name: ${{ inputs.tag }}
          name: USMAN AND UMAR ${{ inputs.tag }}
          body: |
            Verified Android debug artifact from the specified commit.

            Commit: `${{ steps.build-meta.outputs.commit }}`
            Package: `com.usmanandumar.app`
            Version: `3.4.0-taskuary-ai`
            PRoot assets: `armeabi-v7a` and `x86_64` (selected at runtime)

            Physical Galaxy M10 and x86_64 Android/Termux runtime verification are separate and are not claimed by this release.
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
