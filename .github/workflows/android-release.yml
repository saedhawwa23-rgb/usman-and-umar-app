name: Publish verified Android artifact

on:
  push:
    branches:
      - feature/hybrid-task-orchestrator
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to build
        required: true
        default: feature/hybrid-task-orchestrator
      tag:
        description: GitHub Release tag to create
        required: true
        default: v3.6.0-hybrid-orchestrator

permissions:
  contents: write

jobs:
  build-verify-publish:
    name: Build, verify, and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install ARM32 cross-compilation toolchain
        run: |
          sudo dpkg --add-architecture armhf
          sudo tee /etc/apt/sources.list.d/armhf-ports.list >/dev/null <<'EOF'
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-security main universe
          EOF
          sudo apt-get update || true
          sudo apt-get install -y gcc-arm-linux-gnueabihf libseccomp-dev:armhf libtalloc-dev:armhf pkg-config

      - name: Build pinned ARM32 PRoot asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/proot
          git clone https://github.com/termux/proot.git /tmp/proot
          git -C /tmp/proot checkout --quiet b8c1f5c5c6730dc9d521d5bd5ce1cfeedecde087
          grep -R --line-number -- '--link2symlink' /tmp/proot/src/cli/proot.c /tmp/proot/src/cli/proot.h
          make -C /tmp/proot/src -j"$(nproc)" \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            CC=arm-linux-gnueabihf-gcc \
            STRIP=arm-linux-gnueabihf-strip \
            CFLAGS='-marm -DARM_cpsr=uregs[16] -DPSR_T_BIT=0x00000020' \
            LDFLAGS="-static -ltalloc -Wl,-z,noexecstack"
          file /tmp/proot/src/proot | tee /tmp/proot-file.txt
          grep -E 'ELF 32-bit.*ARM.*EABI5.*statically linked' /tmp/proot-file.txt
          mkdir -p app/src/main/assets/proot
          cp /tmp/proot/src/proot app/src/main/assets/proot/proot
          chmod 755 app/src/main/assets/proot/proot

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Verify package, ABI, signature, and checksums
        id: build-meta
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          apk=app/build/outputs/apk/debug/app-debug.apk
          out=dist
          mkdir -p "$out"
          test "$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump packagename "$apk")" = "com.usmanandumar.app"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -F "versionName='3.6.0'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -F "versionCode='24'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk" | tee "$out/SIGNING_STATUS.txt"
          unzip -l "$apk" | grep -F 'assets/proot/proot'
          unzip -p "$apk" assets/proot/proot > /tmp/proot-from-apk
          file /tmp/proot-from-apk | tee "$out/PROOT_ELF.txt"
          grep -E 'ELF 32-bit.*ARM.*EABI5.*statically linked' "$out/PROOT_ELF.txt"
          sha256sum /tmp/proot-from-apk | tee "$out/PROOT_SHA256SUM.txt"
          cp "$apk" "$out/USMAN-AND-UMAR-v3.6.0-hybrid-orchestrator.apk"
          sha256sum "$out/USMAN-AND-UMAR-v3.6.0-hybrid-orchestrator.apk" | tee "$out/SHA256SUMS.txt"
          printf 'commit=%s\nref=%s\ntag=%s\n' "$(git rev-parse HEAD)" "${{ inputs.ref }}" "${{ inputs.tag }}" > "$out/BUILD_METADATA.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          tag_name: ${{ inputs.tag || format('v3.6.0-hybrid-orchestrator-{0}', github.run_number) }}
          name: USMAN AND UMAR ${{ inputs.tag || format('v3.6.0-hybrid-orchestrator-{0}', github.run_number) }}
          body: |
            Verified Android ARM32 debug APK for the Hybrid Task Orchestrator release.

            Commit: `${{ steps.build-meta.outputs.commit }}`
            Package: `com.usmanandumar.app`
            Version: `3.6.0` (versionCode `24`)
            ABI: `armeabi-v7a`

            Physical Samsung Galaxy M10 runtime verification remains separate and is not claimed by this release.
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
