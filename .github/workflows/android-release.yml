name: Publish verified Android artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to build
        required: true
        default: feature/hybrid-task-orchestrator
      tag:
        description: GitHub Release tag to create
        required: true
        default: v3.9.0

permissions:
  contents: write

jobs:
  build-verify-publish:
    name: Build, verify, and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure permanent debug signing
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_B64" || { echo 'ANDROID_DEBUG_KEYSTORE_BASE64 is not configured'; exit 1; }
          # GitHub Secret values are often pasted with wrapping whitespace or a
          # trailing code-fence marker; discard non-base64 formatting before decoding.
          set +e
          printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > debug.keystore
          decode_status=$?
          set -e
          # The checksum is the keystore identity; a decoder warning is harmless
          # only when the resulting bytes are exactly the intended key.
          test "$(sha256sum debug.keystore | cut -d' ' -f1)" = "70ea63b1134cc4e8cf409050fff93d68d709442c7ed919551f283f07db081c6e" || {
            echo "Decoded keystore checksum mismatch (base64 status: $decode_status)" >&2
            exit 1
          }
          chmod 600 debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Restore verified ARM32 PRoot asset from preserved v3.8.0 release
        shell: bash
        run: |
          set -euo pipefail
          source_apk=/tmp/USMAN-AND-UMAR-v3.8.0.apk
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            https://github.com/saedhawwa23-rgb/usman-and-umar-app/releases/download/v3.8.0/USMAN-AND-UMAR-v3.8.0.apk \
            --output "$source_apk"
          echo '1cbd34f95d2a427e3f6253f12e0346f8358bebfa1a728d38e0ce5b7c0f4ab842  '"$source_apk" | sha256sum --check
          unzip -p "$source_apk" assets/proot/proot > /tmp/proot
          echo '6ef736d86c8b9a6de61e8b417876594f9d8ad294a7d10b56110e4632cd2e6be7  /tmp/proot' | sha256sum --check
          file /tmp/proot | tee /tmp/proot-file.txt
          grep -E 'ELF 32-bit.*ARM.*EABI5.*statically linked' /tmp/proot-file.txt
          mkdir -p app/src/main/assets/proot
          cp /tmp/proot app/src/main/assets/proot/proot
          chmod 755 app/src/main/assets/proot/proot

      - name: Run unit tests and build debug APK
        env:
          ORG_GRADLE_PROJECT_DEBUG_STORE_PASSWORD: android
          ORG_GRADLE_PROJECT_DEBUG_KEY_ALIAS: androiddebugkey
          ORG_GRADLE_PROJECT_DEBUG_KEY_PASSWORD: android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Verify package, ABI, signature, and checksums
        id: build-meta
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          apk=app/build/outputs/apk/debug/app-debug.apk
          out=dist
          mkdir -p "$out"
          test "$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump packagename "$apk")" = "com.usmanandumar.app"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -F "versionName='3.9.0'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -F "versionCode='29'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk" | tee "$out/SIGNING_STATUS.txt"
          certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" 2>&1 | tee "$out/SIGNING_CERTS.txt")
          expected_sha1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA1:/{print toupper($2); exit}')
          actual_sha1=$(printf '%s\n' "$certs" | awk -F': ' '/certificate SHA-1 digest:/{print toupper($2); exit}')
          printf 'Expected APK SHA-1: %s\nActual APK SHA-1: %s\n' "$expected_sha1" "$actual_sha1"
          test -n "$actual_sha1" && test "${actual_sha1//:/}" = "${expected_sha1//:/}"
          unzip -l "$apk" | grep -F 'assets/proot/proot'
          unzip -p "$apk" assets/proot/proot > /tmp/proot-from-apk
          file /tmp/proot-from-apk | tee "$out/PROOT_ELF.txt"
          grep -E 'ELF 32-bit.*ARM.*EABI5.*statically linked' "$out/PROOT_ELF.txt"
          sha256sum /tmp/proot-from-apk | tee "$out/PROOT_SHA256SUM.txt"
          cp "$apk" "$out/USMAN-AND-UMAR-v3.9.0.apk"
          sha256sum "$out/USMAN-AND-UMAR-v3.9.0.apk" | tee "$out/SHA256SUMS.txt"
          printf 'commit=%s\nref=%s\ntag=%s\n' "$(git rev-parse HEAD)" "${{ inputs.ref }}" "${{ inputs.tag }}" > "$out/BUILD_METADATA.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          tag_name: ${{ inputs.tag || 'v3.9.0' }}
          target_commitish: ${{ steps.build-meta.outputs.commit }}
          name: USMAN AND UMAR ${{ inputs.tag || 'v3.9.0' }}
          body: |
            USMAN AND UMAR v3.9.0 — universal file picker, modern chat, approval-gated device automation, FMHY discovery, and unified agent.

            Commit: `${{ steps.build-meta.outputs.commit }}`
            Package: `com.usmanandumar.app`
            Version: `3.9.0` (versionCode `29`)
            ABI: `armeabi-v7a`

            Highlights:
            - Universal multi-select file picker accepts APK, ZIP, BIN, `.ipynb`, `.py`, and other document types as metadata; only UTF-8 text up to 1 MB can be explicitly sent to Colab after per-call approval. No attachment is executed.
            - Chat uses a reverse-layout message list and measured Scaffold bottom bar, with separate new-message, IME-open, and initial-scroll effects.
            - Device actions are globally disabled by default, require the owner-enabled Accessibility service, and require exact per-call approval. Kill Switch is available in Chat and Settings.
            - FMHY links are untrusted candidates. Exact hosts require persistent owner approval; browser requests and redirects are pinned to exact allowed hosts.
            - The unified agent combines configured Colab tools, approved site tools, and device tools. It allows at most 12 model iterations and 10 minutes, counts model iterations (not tool calls), and stops after two consecutive non-denial tool failures.
            - OpenRouter model IDs are validated and trimmed; chat-only requests omit tools/tool_choice. Safe bounded vendor messages may appear in the transient error card, never in chat history or prompts.

            Setup and permissions:
            - Local deterministic Android actions require no Colab setup. Accessibility actions require the owner to enable the app's Accessibility service manually; the app never enables it.
            - Colab actions require the owner's Colab runtime and OpenSwarm node configuration. Playwright needs its browser/system libraries installed by the notebook. GitHub reads may require the owner's `GITHUB_TOKEN`; Bubblewrap tooling is only needed for the notebook's optional isolated shell workflow.
            - This app does not automate third-party AI chat websites, execute downloaded attachments, or bypass authentication, CAPTCHAs, paywalls, or rate limits.

            Verification:
            - The Android unit-test task must pass in this workflow before publishing; check the Actions job for the exact test result.
            - Emulator UI/IME and picker-listing checks: NOT VERIFIED by this workflow.
            - Real-phone checks and screenshots (APK/ZIP/`.ipynb` attachments, 20-message scrolling, IME behavior, Kill Switch block, approved/denied device action, FMHY approval flow): NOT VERIFIED by this workflow.

            APK signature and SHA-256 checksum are included with the assets. This package uses the repository's stable Android debug signing key; it is not a Play Store production signing key.
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
