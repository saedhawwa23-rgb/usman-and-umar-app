name: Build Android debug QA artifact (not a release)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true
        default: feature/hybrid-task-orchestrator

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build and upload non-production debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests, lint, and build debug APK
        run: ./gradlew testDebugUnitTest :remote-protocol:test :desktop-agent:test lint assembleDebug --stacktrace

      - name: Verify debug APK metadata
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -s "$apk"
          test "$("$aapt2" dump packagename "$apk")" = "com.usmanandumar.app"
          "$aapt2" dump badging "$apk" | tee debug-badging.txt
          grep -F "versionName='$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -1)'" debug-badging.txt
          grep -F "versionCode='$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle | head -1)'" debug-badging.txt
          sha256sum "$apk" | tee debug-SHA256SUMS.txt

      - name: Upload debug QA artifact (never creates a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: usman-and-umar-debug-qa
          path: |
            app/build/outputs/apk/debug/*.apk
            debug-badging.txt
            debug-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
