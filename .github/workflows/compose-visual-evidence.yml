name: v3.10.6 emulator visual evidence

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hybrid-task-orchestrator
    paths:
      - .github/workflows/compose-visual-evidence.yml
      - app/src/androidTest/java/com/opendroid/ai/ui/screens/VisualEvidenceInstrumentationTest.kt
      - app/src/main/java/com/opendroid/ai/MainActivity.kt
      - app/src/main/java/com/opendroid/ai/ui/Navigation.kt
      - app/src/main/java/com/opendroid/ai/ui/screens/**
      - app/src/main/java/com/opendroid/ai/ui/components/**
permissions:
  contents: read

concurrency:
  group: android-visual-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-visual-evidence]')
    name: Capture emulator before-and-after screens
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PACKAGE_NAME: com.usmanandumar.app
      SCREENSHOT_TEST: com.opendroid.ai.ui.screens.VisualEvidenceInstrumentationTest
      BASELINE_SHA: 21e5076116585a65e8ef09996299456666caa03c
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare evidence directories
        run: mkdir -p artifacts/after artifacts/before artifacts/test-logs artifacts/test-reports

      - name: Capture v3.10.6 screens on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          emulator-boot-timeout: 1200
          disable-spellchecker: true
          disable-animations: true
          script: |
            sh "$GITHUB_WORKSPACE/.github/scripts/capture-emulator-screens.sh" v3.10.6 "$GITHUB_WORKSPACE/artifacts/after" "$GITHUB_WORKSPACE/artifacts/test-logs/v3106-after.log" "$GITHUB_WORKSPACE"

      - name: Prepare pinned v3.10.5 baseline checkout
        run: |
          set -eu
          baseline="$RUNNER_TEMP/usman-and-umar-v3105"
          git worktree add --detach "$baseline" "$BASELINE_SHA"
          mkdir -p "$baseline/app/src/androidTest/java/com/opendroid/ai/ui/screens"
          cp app/src/androidTest/java/com/opendroid/ai/ui/screens/VisualEvidenceInstrumentationTest.kt \
            "$baseline/app/src/androidTest/java/com/opendroid/ai/ui/screens/VisualEvidenceInstrumentationTest.kt"
          cp app/src/main/java/com/opendroid/ai/MainActivity.kt "$baseline/app/src/main/java/com/opendroid/ai/MainActivity.kt"
          cp app/src/main/java/com/opendroid/ai/ui/Navigation.kt "$baseline/app/src/main/java/com/opendroid/ai/ui/Navigation.kt"
          sed -i "/androidTestImplementation 'androidx.test.espresso:espresso-core/a\\    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'" \
            "$baseline/app/build.gradle"
          echo "BASELINE_DIR=$baseline" >> "$GITHUB_ENV"

      - name: Capture v3.10.5 screens on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          emulator-boot-timeout: 1200
          disable-spellchecker: true
          disable-animations: true
          script: |
            sh "$GITHUB_WORKSPACE/.github/scripts/capture-emulator-screens.sh" v3.10.5 "$GITHUB_WORKSPACE/artifacts/before" "$GITHUB_WORKSPACE/artifacts/test-logs/v3105-before.log" "$BASELINE_DIR"

      - name: Verify fourteen genuine emulator screenshots
        run: |
          set -eu
          find artifacts/before artifacts/after -type f -name '*.png' -size +0c -print | sort
          test "$(find artifacts/before -type f -name '*.png' -size +0c | wc -l)" -eq 7
          test "$(find artifacts/after -type f -name '*.png' -size +0c | wc -l)" -eq 7
          file artifacts/before/*.png artifacts/after/*.png

      - name: Upload screenshots, reports, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usman-and-umar-v3.10.6-emulator-visual-evidence-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
