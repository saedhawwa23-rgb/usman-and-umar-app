name: Android CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Must match JavaVersion.VERSION_21 / jvmTarget '21' in app/build.gradle.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      # Only main writes the cache, so pull requests share one warm cache
      # instead of each seeding its own.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Pre-existing findings live in app/lint-baseline.xml; only new
      # findings fail this step.
      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minSdk and targetSdk from app/build.gradle - keep in sync.
        include:
          - api-level: 28
            image-target: default
          - api-level: 36
            image-target: google_apis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Emulator userdata requires about 7.4 GB. Remove large preinstalled
      # toolchains unused by this Android job before installing its SDK image.
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/boost
          df -h "$HOME"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          # Install only this matrix leg's image; the other system image and
          # NDK are not required for connectedDebugAndroidTest.
          packages: 'platform-tools emulator platforms;android-28 platforms;android-36 build-tools;36.0.0 system-images;android-${{ matrix.api-level }};${{ matrix.image-target }};x86_64'

      - name: Install emulator host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Verify emulator toolchain
        run: |
          test -x "$ANDROID_HOME/emulator/emulator"
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/platform-tools/adb" version
          available_bytes=$(df -B1 --output=avail "$HOME" | tail -1 | tr -d ' ')
          echo "Available home filesystem bytes: $available_bytes"
          if [ "$available_bytes" -lt 10000000000 ]; then
            echo "::error::At least 10 GB free is required for the emulator userdata partition and test build."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # GitHub-hosted Linux runners don't grant /dev/kvm access by default;
      # without it the emulator falls back to (much slower, often timing-out)
      # software rendering.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs the whole androidTest source set - not a hand-picked class list,
      # so new instrumentation tests (e.g. #104's real-Keystore cipher test)
      # are picked up automatically.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.image-target }}
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          # Headless launch; KVM is explicitly retained rather than falling
          # back to slow software CPU emulation on hosted Linux runners.
          disable-linux-hw-accel: false
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -accel on
          emulator-boot-timeout: 1200
          disable-spellchecker: true
          disable-animations: true
          # The release APK remains armeabi-v7a-only; CI uses an x86_64 test
          # APK because GitHub-hosted emulators cannot execute ARM-only APKs.
          script: ./gradlew :app:connectedDebugAndroidTest -PinstrumentedTestAbi=x86_64 --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14

  release-build:
    name: Unsigned release build (R8/ProGuard)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # No signing secrets in CI. -PallowUnsignedRelease builds an unsigned,
      # uninstallable APK purely to exercise R8/ProGuard, which debug builds
      # never touch; a plain assembleRelease still refuses to run unsigned.
      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease -PallowUnsignedRelease --stacktrace

      # If R8 ever does strip something reflection needs, the minified APK is
      # what gets inspected (apkanalyzer/aapt) to see which class went missing.
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
