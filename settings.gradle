pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://artifactory.appodeal.com/appodeal-public' }
    }
}
rootProject.name = "USMAN AND UMAR Workspace"
include ':app'
// The remote-control wire protocol, shared verbatim by the Android app and the desktop agent.
include ':remote-protocol'
// The desktop companion agent (Windows/Linux/macOS). A plain JVM application, not Android.
include ':desktop-agent'
