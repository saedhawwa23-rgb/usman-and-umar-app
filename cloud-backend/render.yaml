services:
  - type: web
    name: usman-umar-openswarm-bridge
    runtime: python
    plan: free
    rootDir: cloud-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPEN_SWARM_EXECUTE_URL
        sync: false
      - key: APP_CLIENT_TOKEN
        sync: false
      - key: ENABLE_MOCK_EXECUTION
        sync: false
      - key: OPEN_SWARM_BEARER_TOKEN
        sync: false
